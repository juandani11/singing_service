[tool.pytest.ini_options]
testpaths = ["tests", "integration"]
addopts = "-q -m 'not integration' --cov=app.core --cov=app.main --cov-report=term-missing"
markers = [
    "integration: requiere fixture local o servidor/mock de integración; excluido por defecto (usar pytest -m integration)",
]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Patrón idiomático de FastAPI para parámetros de formulario/archivo
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
